name: Backend CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: alembic upgrade head
        env:
          PACELAB_DATABASE_URL: sqlite:////tmp/pacelab-migration-ci.sqlite
      - run: python -m compileall -q app ml migrations
      - name: Validate local and HTTPS Docker Compose configurations
        working-directory: .
        env:
          POSTGRES_PASSWORD: ci-example-pass
          PACELAB_SECRET_KEY: ci-example-secret-is-long-enough-to-pass-checks
          PACELAB_DOMAIN: example.com
        run: |
          docker compose -f compose.yml config --quiet
          docker compose -f compose.production.yml config --quiet
