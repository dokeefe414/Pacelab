name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run check:docs
      - run: npm run build
      - name: Reproduce synthetic race-evaluation report
        run: npm run research:evaluate -- --input fixtures/race-study-synthetic.json --output-dir private-results --as-of 2025-12-31 --source synthetic
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-race-evaluation
          path: private-results/
          if-no-files-found: error
          retention-days: 7
