# Publish the synthetic, frontend-only PaceLab demo on GitHub Pages.
# One-time repository setting: Settings > Pages > Source: GitHub Actions.
name: Deploy static demo to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'styles.css'
      - 'vite.config.js'
      - 'package.json'
      - '.github/workflows/pages-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check browser-local logic
        run: npm test
      - name: Build static demo
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
