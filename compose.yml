services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pacelab
      POSTGRES_USER: pacelab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pacelab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pacelab -d pacelab"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      PACELAB_ENV: development
      PACELAB_SECRET_KEY: ${PACELAB_SECRET_KEY:?Set PACELAB_SECRET_KEY in .env}
      PACELAB_DB_HOST: db
      PACELAB_DB_USER: pacelab
      PACELAB_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PACELAB_DB_NAME: pacelab
      PACELAB_CORS_ORIGINS: http://localhost:8080
      PACELAB_MODEL_PATH: ${PACELAB_MODEL_PATH:-}
      PACELAB_ASSISTANT_PROVIDER: ${PACELAB_ASSISTANT_PROVIDER:-off}
      PACELAB_ASSISTANT_MODEL: ${PACELAB_ASSISTANT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./backend/models:/app/models:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
volumes:
  pacelab_pgdata:
