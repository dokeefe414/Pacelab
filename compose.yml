services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pacelab
      POSTGRES_USER: pacelab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pacelab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pacelab -d pacelab"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      PACELAB_ENV: development
      PACELAB_SECRET_KEY: ${PACELAB_SECRET_KEY:?Set PACELAB_SECRET_KEY in .env}
      PACELAB_DATABASE_URL: postgresql+psycopg://pacelab:${POSTGRES_PASSWORD}@db:5432/pacelab
      PACELAB_CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  pacelab_pgdata:
